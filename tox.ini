; Dependency management for the training/GRPO Jobs in configs/templates/training/.
; Those Jobs run on a base image that already ships a GPU-matched torch build
; (nvcr.io/nvidia/pytorch:26.05-py3) -- pip-installing a generic torch into an isolated
; venv would silently replace that with one that doesn't match the node's CUDA driver,
; so every env below sets sitepackages=true (== virtualenv's --system-site-packages):
; tox still creates an isolated env for the *listed* deps, but falls back to the base
; image's already-installed torch/CUDA stack for anything not listed here.
;
; Usage from the Job pod (all source files land flat in /workspace, tox.ini included via
; the same ConfigMap -- see configs/templates/training/*.yaml and their headers):
;   tox -e sft -- train_sft.py --base-model ... --train-file ...
;   tox -e grpo -- train_grpo.py --base-model ... --train-file ...
[tox]
envlist = sft, grpo
skipsdist = true
skip_install = true

[testenv]
sitepackages = true
allowlist_externals = python
commands = python {posargs}

[testenv:sft]
deps =
    transformers>=4.44.0
    peft>=0.12.0
    trl>=0.15.0
    accelerate>=0.33.0
    datasets>=2.19.0
    scikit-learn>=1.4.0
    openai>=1.40.0
    jinja2>=3.1.0
    mlflow
    nvidia-ml-py  # lets mlflow's system-metrics logging (log_system_metrics=True) report gpu_* stats, not just cpu/ram

[testenv:grpo]
deps = {[testenv:sft]deps}
