; Dependency management for the training/GRPO Jobs in configs/templates/training/, plus
; a local (no-kube) BFCL env.
;
; sft/grpo run on a base image that already ships a GPU-matched torch build
; (nvcr.io/nvidia/pytorch:26.05-py3) -- pip-installing a generic torch into an isolated
; venv would silently replace that with one that doesn't match the node's CUDA driver,
; so both set sitepackages=true (== virtualenv's --system-site-packages): tox still
; creates an isolated env for the *listed* deps, but falls back to the base image's
; already-installed torch/CUDA stack for anything not listed here.
;
; Usage from the Job pod (all source files land flat in /workspace, tox.ini included via
; the same ConfigMap -- see configs/templates/training/*.yaml and their headers):
;   tox -e sft -- train_sft.py --base-model ... --train-file ...
;   tox -e grpo -- train_grpo.py --base-model ... --train-file ...
;
; [testenv:bfcl] is different: it runs directly on a bare GPU host, not a kube Job or
; either image above, so there's no known-matching system torch to fall back to --
; sitepackages=false there lets vllm pull in its own compatible torch instead of risking
; a mismatch with whatever (if anything) is on the host's own Python. It runs
; 2_evaluations/log_bfcl_to_mlflow.py, not bfcl_eval's own CLI directly: bfcl-eval has no
; MLflow integration on its own (that script's whole job is bridging that gap -- see its
; module docstring), and by default it self-hosts vLLM itself (bfcl generate shells out
; to `vllm serve <model> ...` as a subprocess and tears it down when done -- confirmed
; against bfcl_eval/model_handler/local_inference/base_oss_handler.py, not assumed), so
; no separate serve step or --skip-server-setup/--vllm-endpoint is needed either.
; commands runs 2_evaluations/log_bfcl_to_mlflow.py directly (script path and
; --mlflow-tracking-uri baked in, so {posargs} only needs the eval-specific flags).
;
; The baked-in URI is http://localhost:5000, NOT the in-cluster
; mlflow.fin-agent.svc.cluster.local name the kube manifests use -- that hostname is
; Kubernetes' own internal DNS, resolvable only from inside the cluster (real error hit
; running this from a bare host: "Failed to resolve 'mlflow.fin-agent.svc.cluster.local'
; ... Temporary failure in name resolution"). Reaching MLflow from this host needs the
; same port-forward every other out-of-cluster access already uses (see
; configs/setup/mlflow.yaml's own header):
;   kubectl -n fin-agent port-forward svc/mlflow 5000:5000
; running in another terminal first.
; Usage:
;   tox -e bfcl -- --model Qwen/Qwen3-8B --test-category python
;   # --local-model-path /path/to/checkpoint instead of relying on --model alone to
;   # evaluate a fine-tuned checkpoint rather than the raw baseline.
;   # Override the baked-in tracking URI by just passing --mlflow-tracking-uri again in
;   # {posargs} -- argparse takes the last occurrence of a flag, so it wins over the one
;   # in `commands` below.
[tox]
envlist = sft, grpo, bfcl, vllm-serve, vllm-bench
skipsdist = true
skip_install = true

[testenv]
sitepackages = true
allowlist_externals = python
commands = python {posargs}

[testenv:sft]
deps =
    transformers>=4.44.0
    peft>=0.12.0
    trl>=0.15.0
    accelerate>=0.33.0
    datasets>=2.19.0
    scikit-learn>=1.4.0
    openai>=1.40.0
    jinja2>=3.1.0
    mlflow
    nvidia-ml-py  # lets mlflow's system-metrics logging (log_system_metrics=True) report gpu_* stats, not just cpu/ram

[testenv:grpo]
deps =
    {[testenv:sft]deps}
    scipy>=1.10

[testenv:sft-tests]
deps =
    {[testenv:grpo]deps}
    pytest
commands = python -m pytest tests/ {posargs}

[testenv:bfcl]
sitepackages = false
; commands_pre patches the just-installed bfcl-eval package on disk to close a gap in its
; own QwenHandler -- see patch_bfcl_qwen_handler.py's docstring for the full story
; (short version: bfcl-eval's raw-completions prompt never suppresses Qwen3's default
; reasoning like its own chat-template reference says it should, so Qwen3 leaks an
; unclosed <think> tag that breaks BFCL's parser). Must be commands_pre, not folded into
; commands -- it needs bfcl-eval already installed (a tox deps, resolved before
; commands_pre runs) and must finish before `bfcl generate` runs.
commands_pre = python 2_evaluations/patch_bfcl_qwen_handler.py
commands = python 2_evaluations/log_bfcl_to_mlflow.py --mlflow-tracking-uri http://localhost:5000 {posargs}
deps =
    bfcl-eval==2025.8.6.2
    vllm
    transformers
    soundfile
    jinja2
    mlflow
    openai
    aiohttp

[testenv:vllm-serve]
; Serves one MLflow run's model artifact via vLLM -- the no-kube analogue of
; configs/templates/inference/vllm-grpo-mtp.yaml's initContainer (download by run_id)
; + vllm serve. sitepackages=false for the same reason as [testenv:bfcl]: bare host, no
; known-matching system torch, let vllm bring its own. Long-running (this is `vllm
; serve`, not a one-shot eval) -- run it in its own terminal/tmux pane, or backgrounded.
;
; Baked-in URI is http://localhost:5000, not the in-cluster mlflow.fin-agent.svc.
; cluster.local name -- see [testenv:bfcl]'s identical note above for why (that hostname
; is Kubernetes-internal DNS, unresolvable from a bare host) and the required
; `kubectl -n fin-agent port-forward svc/mlflow 5000:5000` running in another terminal.
; Usage:
;   tox -e vllm-serve -- --run-id e783b52f2b7a42cc8ff2b2786949cb71
;   # extra flags (--dtype, --tensor-parallel-size, ...) pass straight through to
;   # `vllm serve` unmodified -- see serve_mlflow_checkpoint.py's own --help.
sitepackages = false
commands = python 2_evaluations/serve_mlflow_checkpoint.py --mlflow-tracking-uri http://localhost:5000 {posargs}
deps =
    vllm
    mlflow

[testenv:vllm-bench]
; Runs `vllm bench serve` against an already-running vLLM endpoint (e.g. this env's
; sibling [testenv:vllm-serve], or the ./vllm-serve-checkpoint.yaml Deployment
; port-forwarded to localhost) and logs its TTFT/TPOT/ITL/throughput metrics to MLflow --
; log_vllm_bench_to_mlflow.py bridges that gap the same way log_bfcl_to_mlflow.py does for
; bfcl-eval. sitepackages=false for the same reason as [testenv:bfcl]/[testenv:vllm-serve]:
; bare host, let vllm bring its own torch. One-shot (not long-running like vllm-serve).
;
; Baked-in URI is http://localhost:5000 -- see [testenv:bfcl]'s identical note above for
; why (Kubernetes-internal DNS, unresolvable from a bare host) and the required
; `kubectl -n fin-agent port-forward svc/mlflow 5000:5000` running in another terminal.
; Usage (run once per concurrency level you want to compare, see root README's
; "Confirmed constraints" -- each becomes its own MLflow run):
;   tox -e vllm-bench -- --base-url http://localhost:8000 --model Qwen/Qwen3-8B \
;     --bfcl-categories simple,multiple,parallel,parallel_multiple --max-concurrency 32
;   # extra flags pass straight through to `vllm bench serve` unmodified -- see
;   # log_vllm_bench_to_mlflow.py's own --help.
sitepackages = false
commands = python 2_evaluations/log_vllm_bench_to_mlflow.py --mlflow-tracking-uri http://localhost:5000 {posargs}
deps =
    vllm
    mlflow
