apiVersion: apps/v1
kind: Deployment
metadata:
  name: fin-agent-vllm-grpo-mtp
  namespace: fin-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: fin-agent-vllm-grpo-mtp }
  template:
    metadata:
      labels: { app: fin-agent-vllm-grpo-mtp }
    spec:
      runtimeClassName: nvidia
      initContainers:
        - name: fetch-model
          image: python:3.12-slim
          command:
            - sh
            - -c
            - |
              set -e
              pip install --no-cache-dir mlflow
              python3 -c "
              import mlflow
              mlflow.artifacts.download_artifacts(run_id='__RUN_ID__', artifact_path='model', dst_path='/model')
              "
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.fin-agent.svc.cluster.local:5000
          volumeMounts:
            - { name: mlflow-artifacts, mountPath: /data/artifacts, readOnly: true }
            - { name: model-cache, mountPath: /model }
      containers:
        - name: vllm
          image: vllm/vllm-openai:cu130-nightly
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              exec vllm serve /model
              --served-model-name Qwen/Qwen3-8B
              --gpu-memory-utilization 0.5
              --max-model-len 32768
              --speculative-config '{"method": "mtp", "num_speculative_tokens": 4}'
              --guided-decoding-backend xgrammar
              --host 0.0.0.0 --port 8000
          env:
            - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
              value: "1"
          ports:
            - containerPort: 8000
          resources:
            limits: { nvidia.com/gpu: 1 }
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          volumeMounts:
            - { name: model-cache, mountPath: /model, readOnly: true }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: mlflow-artifacts
          persistentVolumeClaim: { claimName: fin-agent-mlflow-artifacts }
        - name: model-cache
          emptyDir: {}
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 4Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: fin-agent-vllm-grpo-mtp
  namespace: fin-agent
spec:
  selector: { app: fin-agent-vllm-grpo-mtp }
  ports:
    - port: 8000
      targetPort: 8000
