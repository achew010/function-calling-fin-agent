# Smoke test for the SFT pipeline (1_training/1_sft/train_sft.py): proves data loading,
# the training loop, the generation-based eval callback, and checkpoint saving all work
# end-to-end, before trusting the real (hours-long, full-dataset) training run to the
# same code. Run this before a real training run, not alongside anything in ../inference/ or
# grpo-job.yaml — this project targets a single GPU running one workload at a time.
#
# Deliberately NOT a faithful preview of the real run's numbers: max-steps/eval-strategy/
# eval-steps/tiny-data below are smoke-test-only overrides passed as explicit CLI flags —
# train_sft.py's own defaults (epoch-based, full dataset) are unchanged and are what the
# real run uses. Only change these values here, never in train_sft.py itself.
#
# --per-device-batch-size is the one deliberate exception: it's set to match
# train_sft.py's own real-run default (not minimized) so this smoke test doubles as an
# early OOM check — if 32 @ --max-seq-length 8192 (also inherited from train_sft.py's
# default, not overridden here) doesn't fit the GPU's memory, this 10-step run surfaces
# that in minutes instead of hours into the real sft-job.yaml run.
#
# Prerequisites:
#   1. setup/setup.sh (creates the namespace + MLflow this job logs to)
#   2. prepare-dataset-job.yaml, run to completion first — this reads a 20/8-example
#      slice (head of the real prepared splits, not fabricated) straight off the shared
#      PVC it populates, rather than a separately hand-built data ConfigMap:
#        kubectl apply -f configs/templates/training/prepare-dataset-job.yaml
#        kubectl -n fin-agent wait --for=condition=complete job/fin-agent-prepare-dataset --timeout=1800s
#
# Code ships as a ConfigMap and gets pip-installed at pod start, rather than baking a
# custom image. Dependencies are installed via tox (tox.ini at the project root,
# sft/grpo share it) — sitepackages=true so it layers transformers/peft/trl/etc. on top
# of the base image's already-installed, GPU-matched torch instead of pip installing a
# fresh (CUDA-mismatched) one into an isolated venv. Build the ConfigMap from the
# fin_agent project root before applying this job:
#
#   kubectl create configmap fin-agent-sft-src -n fin-agent \
#     --from-file=prepare_dataset.py=0_data/prepare_dataset.py \
#     --from-file=run_internal_eval.py=2_evaluations/run_internal_eval.py \
#     --from-file=metrics.py=1_training/1_sft/metrics.py \
#     --from-file=train_sft.py=1_training/1_sft/train_sft.py \
#     --from-file=tox.ini=tox.ini
#
# The checkpoint is written to hostPath (/var/lib/fin-agent/checkpoints/smoke-test,
# distinct from sft-job.yaml's own .../checkpoints/sft) rather than the container's
# ephemeral storage: grpo-job.yaml's own smoke test and a BFCL smoke eval both chain
# off this checkpoint as their starting model, so it has to survive this pod exiting.
#
# Run:    kubectl apply -f configs/templates/training/smoke-test-job.yaml
# Logs:   kubectl -n fin-agent logs -l app=fin-agent-smoke-test -f
# Clean up (Jobs don't self-delete; the checkpoint on hostPath is left in place since
# grpo-job.yaml's smoke test and the BFCL smoke eval depend on it):
#   kubectl -n fin-agent delete job fin-agent-sft-smoke-test
#   kubectl -n fin-agent delete configmap fin-agent-sft-src
apiVersion: batch/v1
kind: Job
metadata:
  name: fin-agent-sft-smoke-test
  namespace: fin-agent
spec:
  backoffLimit: 0                  # a broken pipeline needs a human, not a silent retry
  activeDeadlineSeconds: 1800      # 30 min ceiling — 10 steps + a tiny generation-based eval should be minutes, not that
  template:
    metadata:
      labels: { app: fin-agent-smoke-test }
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      containers:
        - name: sft-smoke-test
          # A recent NVIDIA PyTorch NGC image with broad CUDA compute-capability support
          # (Ampere/Hopper and newer, incl. H100). An older tag can silently ship a torch
          # build that doesn't recognize a newer GPU's compute capability at all — hit
          # this for real on different hardware and had to bump to a newer tag; if
          # `torch.cuda.is_available()` or CUDA ops fail here, try a newer tag first.
          image: nvcr.io/nvidia/pytorch:26.05-py3
          workingDir: /workspace
          command:
            - sh
            - -c
            - |
              set -e
              pip install --no-cache-dir tox
              cp /src/* /workspace/
              tox -e sft -- train_sft.py \
                --base-model Qwen/Qwen3-8B \
                --train-file /data/prepared/smoke_train.jsonl \
                --val-file /data/prepared/smoke_val.jsonl \
                --output-dir /checkpoints/smoke-test \
                --max-steps 10 \
                --per-device-batch-size 32 --grad-accum 1 --max-seq-length 8192 \
                --eval-strategy steps --eval-steps 5 \
                --save-strategy steps --save-steps 10 \
                --logging-steps 1 \
                --metrics-eval-samples 8 --metrics-max-new-tokens 256 \
                --mlflow --mlflow-tracking-uri http://mlflow.fin-agent.svc.cluster.local:5000 \
                --mlflow-experiment-name fin-agent-sft-smoke-test
              echo "--- checkpoint contents (proves model saving worked) ---"
              ls -la /checkpoints/smoke-test
          env:
            - name: HF_TOKEN
              valueFrom: { secretKeyRef: { name: hf-token, key: token, optional: true } }
          resources:
            requests: { cpu: "4", memory: 32Gi, ephemeral-storage: 20Gi }
            limits: { cpu: "4", memory: 32Gi, ephemeral-storage: 20Gi, nvidia.com/gpu: 1 }
          volumeMounts:
            - { name: src, mountPath: /src }
            - { name: dataset, mountPath: /data/prepared, readOnly: true }
            - { name: hf-cache, mountPath: /root/.cache/huggingface }
            - { name: checkpoints, mountPath: /checkpoints }
            # Same PVC + path setup/mlflow.yaml's Deployment mounts -- see its header
            # comment for why this has to be a shared volume, not just an MLflow config
            # flag, for mlflow.log_artifacts() (in train_sft.py) to actually reach the
            # MLflow server instead of silently writing to this pod's own filesystem.
            - { name: mlflow-artifacts, mountPath: /data/artifacts }
      volumes:
        - name: src
          configMap: { name: fin-agent-sft-src }
        - name: dataset
          persistentVolumeClaim: { claimName: fin-agent-dataset }
        - name: checkpoints
          hostPath: { path: /var/lib/fin-agent/checkpoints, type: DirectoryOrCreate }
        - name: mlflow-artifacts
          persistentVolumeClaim: { claimName: fin-agent-mlflow-artifacts }
        - name: hf-cache
          hostPath: { path: /var/lib/hf-cache, type: DirectoryOrCreate }
