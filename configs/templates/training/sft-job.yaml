# The real SFT run (1_training/1_sft/train_sft.py) — full ToolACE-derived dataset,
# train_sft.py's own defaults (1 epoch, LoRA bf16, gradient checkpointing, eval/save
# every 140 steps), not the smoke test's 10-step/tiny-data overrides.
# --per-device-batch-size/--grad-accum/
# --max-seq-length below are spelled out explicitly (matching sft-smoke-job.yaml)
# even though they're currently just train_sft.py's own defaults too, so the real
# run's actual memory footprint is visible here rather than only in train_sft.py's
# argparse help. Run sft-smoke-job.yaml first to prove the pipeline works end-to-end
# before committing GPU hours to this one — it now uses the same batch size/sequence
# length so it also serves as an early OOM check for this job specifically.
#
# Not alongside anything in ../inference/ or grpo-smoke-job.yaml/grpo-job.yaml — this
# project targets a single GPU running one workload at a time.
#
# Prerequisites:
#   1. setup/setup.sh (creates the namespace + MLflow this job logs to)
#   2. prepare-dataset-job.yaml, run to completion first -- ToolACE's full train/val/test
#      splits run well past the ~1MiB ConfigMap size limit, so this project prepares them
#      once into a shared PVC (fin-agent-dataset) rather than each training job (or this
#      one) re-running prepare_dataset.py itself or ConfigMapping the data in:
#        kubectl apply -f configs/templates/training/prepare-dataset-job.yaml
#        kubectl -n fin-agent wait --for=condition=complete job/fin-agent-prepare-dataset --timeout=1800s
#
# This job's own source still reuses the same ConfigMap sft-smoke-job.yaml builds
# (including tox.ini — dependencies are installed via tox, sitepackages=true so it
# layers onto the base image's GPU-matched torch instead of pip installing a fresh one
# into an isolated venv; see tox.ini's header). prepare_dataset.py is still needed here
# even though its CLI isn't invoked anymore: train_sft.py imports its call-syntax parser
# directly (try_parse_calls).
#
#   kubectl create configmap fin-agent-sft-src -n fin-agent \
#     --from-file=prepare_dataset.py=0_data/prepare_dataset.py \
#     --from-file=run_internal_eval.py=2_evaluations/run_internal_eval.py \
#     --from-file=metrics.py=1_training/1_sft/metrics.py \
#     --from-file=train_sft.py=1_training/1_sft/train_sft.py \
#     --from-file=tox.ini=tox.ini
#
# The checkpoint is written to hostPath (like hf-cache and mlflow's own data elsewhere in
# this project) rather than the container's ephemeral storage, since it's the actual
# deliverable of this run and has to survive the pod — unlike the smoke test, where the
# checkpoint only exists to prove `trainer.save_model()` doesn't crash.
#
# Run:    kubectl apply -f configs/templates/training/sft-job.yaml
# Logs:   kubectl -n fin-agent logs -l app=fin-agent-sft -f
# Progress: MLflow (port-forward per setup/mlflow.yaml's header) — logging-steps below
#           and train_sft.py's FunctionCallEvalCallback report loss/eval metrics per step.
# Checkpoint: /var/lib/fin-agent/checkpoints/sft on the node afterward.
# Clean up (Jobs don't self-delete; the checkpoint on hostPath is left in place):
#   kubectl -n fin-agent delete job fin-agent-sft
apiVersion: batch/v1
kind: Job
metadata:
  name: fin-agent-sft
  namespace: fin-agent
spec:
  backoffLimit: 0             # a training run that dies mid-way needs a human, not a silent retry
  activeDeadlineSeconds: 86400  # 24h ceiling — 1 epoch over the full dataset on 1 GPU is hours, not minutes, but not unbounded either
  template:
    metadata:
      labels: { app: fin-agent-sft }
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      containers:
        - name: sft
          image: nvcr.io/nvidia/pytorch:26.05-py3   # same image as sft-smoke-job.yaml — see its comment on why a recent tag matters
          workingDir: /workspace
          command:
            - sh
            - -c
            - |
              set -e
              pip install --no-cache-dir tox
              cp /src/* /workspace/
              mkdir -p /checkpoints/sft
              tox -e sft -- train_sft.py \
                --base-model Qwen/Qwen3-8B \
                --train-file /data/prepared/train.jsonl \
                --val-file /data/prepared/val.jsonl \
                --output-dir /checkpoints/sft \
                --per-device-batch-size 16 --grad-accum 1 --max-seq-length 8192 \
                --mlflow --mlflow-tracking-uri http://mlflow.fin-agent.svc.cluster.local:5000 \
                --mlflow-experiment-name fin-agent-sft
              echo "--- checkpoint contents ---"
              ls -la /checkpoints/sft
          env:
            - name: HF_TOKEN
              valueFrom: { secretKeyRef: { name: hf-token, key: token, optional: true } }
            # Hit a real CUDA OOM mid-run (step 470/1785) with only 3.31GiB free but
            # 10.15GiB "reserved by PyTorch but unallocated" -- fragmentation, not a
            # genuine capacity shortfall (gradient checkpointing's repeated
            # allocate/free-on-recompute pattern is a known contributor). This is
            # PyTorch's own suggested fix for exactly that symptom, not a guess.
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
          resources:
            requests: { cpu: "8", memory: 64Gi, ephemeral-storage: 40Gi }
            limits: { cpu: "8", memory: 64Gi, ephemeral-storage: 40Gi, nvidia.com/gpu: 1 }
          volumeMounts:
            - { name: src, mountPath: /src }
            - { name: hf-cache, mountPath: /root/.cache/huggingface }
            - { name: checkpoints, mountPath: /checkpoints }
            - { name: dataset, mountPath: /data/prepared, readOnly: true }
            # Same PVC + path setup/mlflow.yaml's Deployment mounts -- see its header
            # comment for why this has to be a shared volume, not just an MLflow config
            # flag, for mlflow.log_artifacts() (in train_sft.py) to actually reach the
            # MLflow server instead of silently writing to this pod's own filesystem.
            - { name: mlflow-artifacts, mountPath: /data/artifacts }
      volumes:
        - name: src
          configMap: { name: fin-agent-sft-src }
        - name: hf-cache
          hostPath: { path: /var/lib/hf-cache, type: DirectoryOrCreate }
        - name: checkpoints
          hostPath: { path: /var/lib/fin-agent/checkpoints, type: DirectoryOrCreate }
        - name: dataset
          persistentVolumeClaim: { claimName: fin-agent-dataset }
        - name: mlflow-artifacts
          persistentVolumeClaim: { claimName: fin-agent-mlflow-artifacts }
