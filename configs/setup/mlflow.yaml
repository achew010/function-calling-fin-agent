# Self-contained MLflow tracking server for this project's jobs — a fresh instance for
# this VM, not the specific home-lab instance this project was originally developed
# against. ClusterIP only (no Ingress): job manifests here reach it via in-cluster DNS
# (mlflow.fin-agent.svc.cluster.local:5000), and for human/UI access from outside
# the cluster, port-forward:
#   kubectl -n fin-agent port-forward svc/mlflow 5000:5000
#
# fin-agent-mlflow-artifacts-pv/pvc below is a *statically provisioned* PV/PVC pair —
# a hostPath backing it directly (at /var/lib/fin-agent/mlflow-artifacts on this VM's
# own disk) rather than the cluster's default `local-path` dynamic provisioner, which
# would pick an opaque, unpredictable directory under its own management path instead.
# A distinct storageClassName on both the PV and this PVC makes them bind to each other
# specifically, bypassing dynamic provisioning entirely.
#
# Why this exists at all: MLflow's server was passing --default-artifact-root as a bare
# local path (/data/artifacts), which (verified against mlflow's own
# resolve_default_artifact_root() source) only gets upgraded to the HTTP-proxied
# mlflow-artifacts:/ scheme when --default-artifact-root is left unset — with it set
# explicitly, new experiments' artifact_uri stays a bare local path, so a training job's
# MLflow client (running in a completely different pod) resolves that to a
# LocalArtifactRepository and tries to write directly to ITS OWN container's
# filesystem instead of proxying the upload over HTTP to this server. Those writes
# silently land nowhere useful and vanish with the pod — no error, no artifacts, ever.
# Mounting this same PVC into both this Deployment and every training job that logs a
# model (see sft-smoke-job.yaml, sft-job.yaml, grpo-smoke-job.yaml, grpo-job.yaml) at the
# identical container path (/data/artifacts) sidesteps the proxy-scheme question
# entirely: both sides are just reading/writing the same underlying directory directly.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: fin-agent-mlflow-artifacts-pv
spec:
  capacity:
    storage: 20Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fin-agent-mlflow-artifacts
  hostPath:
    path: /var/lib/fin-agent/mlflow-artifacts
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fin-agent-mlflow-artifacts
  namespace: fin-agent
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: fin-agent-mlflow-artifacts
  resources:
    requests: { storage: 20Gi }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlflow-config
  namespace: fin-agent
data:
  MLFLOW_ARTIFACT_ROOT: /data/artifacts
  MLFLOW_SQLSTORE_URI: sqlite:////data/mlflow.db
  HOST: "0.0.0.0"
  PORT: "5000"
  # Wildcarded rather than pinned to a specific hostname/IP: this config is meant to run
  # on an arbitrary VM, so there's no fixed ingress hostname or ClusterIP to allowlist
  # ahead of time. mlflow's Host-header and CORS checks default to accepting only
  # localhost + bare private IPs, which 403s the in-cluster DNS name jobs actually use —
  # hit this for real building this project's original (non-portable) manifests:
  # "Invalid Host header - possible DNS rebinding attack detected" on the Host check, and
  # a separate "Blocked cross-origin request" from the UI's own /ajax-api/* calls once
  # the Host check was fixed. Fine for this self-contained/single-VM deployment; tighten
  # both to an explicit allowlist if you expose this instance more broadly.
  MLFLOW_SERVER_ALLOWED_HOSTS: "*"
  MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "*"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: fin-agent
spec:
  replicas: 1
  selector:
    matchLabels: { app: mlflow }
  template:
    metadata:
      labels: { app: mlflow }
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:latest
          command: ["sh", "-c"]
          args:
            - |
              exec python -m mlflow server \
                --host "$HOST" --port "$PORT" --workers 1 \
                --backend-store-uri "$MLFLOW_SQLSTORE_URI" \
                --default-artifact-root "$MLFLOW_ARTIFACT_ROOT"
          envFrom:
            - configMapRef: { name: mlflow-config }
          ports:
            - containerPort: 5000
          resources:
            requests: { memory: 512Mi, cpu: 100m }
            limits: { memory: 3Gi }
          startupProbe:
            httpGet: { path: /, port: 5000 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /, port: 5000 }
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: artifacts, mountPath: /data/artifacts }
      volumes:
        - name: data
          hostPath:
            path: /var/lib/fin-agent/mlflow
            type: DirectoryOrCreate
        - name: artifacts
          persistentVolumeClaim: { claimName: fin-agent-mlflow-artifacts }
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: fin-agent
spec:
  selector: { app: mlflow }
  ports:
    - port: 5000
      targetPort: 5000
